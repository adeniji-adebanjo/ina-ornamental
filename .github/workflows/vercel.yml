name: Vercel

# Vercel deployments driven from GitHub Actions (Vercel's own Git integration
# is switched off in vercel.json so nothing deploys twice).
#
# • Every pull request → a PREVIEW deployment; the URL is posted on the PR.
# • Production on Vercel → MANUAL only (Actions → Vercel → Run workflow →
#   target: production), gated by the "vercel-production" environment.
#   The live site normally runs on the Nginx server (deploy.yml); keep
#   inaornamentalfish.com pointed at ONE of the two.
#
# Setup and caveats: deploy/DEPLOYMENT.md, "Vercel".

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Vercel environment to deploy to
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # Pinned CLI version; bump deliberately (Dependabot can't track this one).
  VERCEL_CLI: vercel@64.4.0
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  preview:
    name: Preview deployment
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # to post the preview URL
    concurrency:
      group: vercel-preview-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID as repository secrets (see deploy/DEPLOYMENT.md, Vercel)."
            exit 1
          fi

      - run: npm install --global "$VERCEL_CLI"

      # Pulls the project settings and the Preview environment variables
      # configured in the Vercel dashboard.
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Post preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- vercel-preview -->";
            const body = `${marker}\n**Vercel preview:** ${process.env.PREVIEW_URL}\n\n` +
              `Commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\`. ` +
              `Previews use the Vercel *Preview* environment variables — check they point at a test database before placing orders.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  production:
    name: Production deployment (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Add required reviewers to this environment so a production deploy waits
    # for approval (Settings → Environments → vercel-production).
    environment:
      name: vercel-production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global "$VERCEL_CLI"

      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Production: $url" >> "$GITHUB_STEP_SUMMARY"
