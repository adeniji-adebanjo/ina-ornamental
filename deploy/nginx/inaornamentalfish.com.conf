# ─────────────────────────────────────────────────────────────────────────────
# inaornamentalfish.com — Next.js app at the apex, WordPress kept only for
# /wp-admin, /wp-login.php, /wp-json, /wp-cron.php and /wp-content/uploads media.
#
# Install:  /etc/nginx/sites-available/inaornamentalfish.com.conf
#           ln -s ../sites-available/... /etc/nginx/sites-enabled/
# Requires: /etc/nginx/snippets/ina-security.conf  (see deploy/nginx/snippets)
#           Ubuntu's stock /etc/nginx/snippets/fastcgi-php.conf
# Ubuntu 22.04 · PHP 8.2-FPM (unix:/run/php/php8.2-fpm.sock) · Next.js on :3000
# ─────────────────────────────────────────────────────────────────────────────

upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── HTTP :80 — ACME challenge + redirect everything to HTTPS ──────────────────
server {
    listen 80;
    listen [::]:80;
    server_name inaornamentalfish.com www.inaornamentalfish.com;

    # Let's Encrypt webroot challenge (keep reachable over HTTP).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://inaornamentalfish.com$request_uri;
    }
}

# ── HTTPS :443 — www → non-www canonical redirect ─────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.inaornamentalfish.com;

    ssl_certificate     /etc/letsencrypt/live/inaornamentalfish.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inaornamentalfish.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://inaornamentalfish.com$request_uri;
}

# ── HTTPS :443 — main site ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name inaornamentalfish.com;

    # WordPress document root — used only for the whitelisted PHP/static paths.
    root  /var/www/wordpress;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/inaornamentalfish.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inaornamentalfish.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (inherited by child blocks that set no headers of their own).
    include snippets/ina-security.conf;

    # Allow WordPress media uploads through wp-admin.
    client_max_body_size 64m;

    # ── gzip ──────────────────────────────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    5;
    gzip_min_length    256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml application/xml+rss
        application/rss+xml application/atom+xml font/ttf font/otf
        application/vnd.ms-fontobject application/font-woff2 image/svg+xml;

    # ===========================================================================
    # (1) WordPress MEDIA — served statically from disk, 1-year immutable cache.
    #     Longest-prefix match wins, so this beats /wp-content/ below.
    # ===========================================================================
    location ^~ /wp-content/uploads/ {
        include snippets/ina-security.conf;          # re-include: we set headers here
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        # Never execute PHP from the uploads dir (upload-shell defense).
        location ~* \.php$ { deny all; }
        try_files $uri =404;
    }

    # WordPress static assets needed for the admin UI to render (themes/plugins).
    location ^~ /wp-content/ {
        include snippets/ina-security.conf;
        add_header Cache-Control "public, max-age=604800" always;   # 7 days
        location ~* \.php$ { deny all; }
        try_files $uri =404;
    }
    location ^~ /wp-includes/ {
        include snippets/ina-security.conf;
        add_header Cache-Control "public, max-age=604800" always;
        location ~* \.php$ { deny all; }
        try_files $uri =404;
    }

    # ===========================================================================
    # (2) WordPress dynamic endpoints — the ONLY paths that may execute PHP.
    # ===========================================================================

    # Bare /wp-admin and /wp-json (no trailing slash) would otherwise fall
    # through to the Next.js proxy and 404. Redirect to the slashed form so the
    # prefix locations below match. (WordPress itself normally does this 301,
    # but it never gets the request now.)
    location = /wp-admin { return 301 https://$host/wp-admin/; }
    location = /wp-json  { return 301 https://$host/wp-json/; }

    location ^~ /wp-admin/ {
        try_files $uri $uri/ /wp-admin/index.php?$args;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;       # sets SCRIPT_FILENAME, PATH_INFO, try_files =404
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            fastcgi_read_timeout 300;
        }
    }

    location = /wp-login.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # System cron will hit this (see deploy/DEPLOYMENT.md). Lock to localhost.
    location = /wp-cron.php {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # REST API → WordPress front controller, via an INTERNAL named location so
    # /index.php is never publicly routable (keeps the old WP homepage hidden).
    location ^~ /wp-json/ {
        try_files $uri $uri/ @wp_index;
    }
    location @wp_index {
        include fastcgi.conf;                        # SCRIPT_FILENAME=$document_root$fastcgi_script_name
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 300;
    }

    # Block common abuse vectors.
    location = /xmlrpc.php { deny all; }
    location ~* /(?:\.git|\.env|wp-config\.php|readme\.html|license\.txt)$ { deny all; }

    # ===========================================================================
    # (3) EVERYTHING ELSE → Next.js. WP frontend permalinks and /index.php land
    #     here (not in WordPress), satisfying "redirect WP frontend to Next".
    # ===========================================================================
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # Required header preservation.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket support (no-op in prod, harmless).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# Maps Connection header for WebSocket upgrades. Place once (http scope) —
# move this to /etc/nginx/conf.d/ if it collides with an existing definition.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
