# /etc/nginx/snippets/ina-csp.conf
# Content-Security-Policy for the Next.js app, in REPORT-ONLY mode: browsers
# evaluate it and log violations to the console, but block nothing. After a
# week or two of normal use with no violations (check DevTools → Console on
# the main pages, the catalogue, a price-list link, login and the admin),
# switch the header name to `Content-Security-Policy` to enforce it.
#
# 'unsafe-inline' for scripts is required because Next.js injects inline
# bootstrap scripts; removing it needs per-request nonces (a code change).
#
# NOTE: a location that includes this file sets its own add_header, so it must
# include snippets/ina-security.conf as well or those headers are dropped.

add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
