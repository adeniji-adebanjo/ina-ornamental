# /etc/nginx/snippets/ina-security.conf
# Shared security headers. `always` ensures they are sent on error responses too.
#
# NOTE on inheritance: nginx only inherits add_header from a parent block when
# the child block defines NO add_header of its own. Terminal blocks that set
# their own headers (e.g. the static cache locations) therefore `include` this
# file again so the security headers are not dropped.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# HSTS: 1 year. Add `; preload` only once you are certain every host on the
# domain (incl. mail) is HTTPS-ready and you intend to submit to the preload
# list (it is hard to undo). includeSubDomains affects HTTPS on subdomains only.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Do not advertise the backend.
server_tokens off;
