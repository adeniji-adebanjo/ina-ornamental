# ─────────────────────────────────────────────────────────────────────────────
# cms.inaornamentalfish.com — WordPress (admin + media) on the Ubuntu server.
#
# The Next.js app stays on Netlify at the apex. This subdomain serves ONLY
# WordPress: /wp-admin, login, REST, and /wp-content/uploads media.
#
# Install:  /etc/nginx/sites-available/cms.inaornamentalfish.com.conf
#           ln -s ../sites-available/... /etc/nginx/sites-enabled/
# Requires: /etc/nginx/snippets/ina-security.conf  +  stock fastcgi-php.conf
# ─────────────────────────────────────────────────────────────────────────────

# HTTP :80 — ACME challenge + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cms.inaornamentalfish.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }
    location / { return 301 https://cms.inaornamentalfish.com$request_uri; }
}

# HTTPS :443 — WordPress
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cms.inaornamentalfish.com;

    root  /var/www/wordpress;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/cms.inaornamentalfish.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.inaornamentalfish.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/ina-security.conf;
    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml application/xml+rss
        application/rss+xml image/svg+xml;

    # Media — long cache, served straight from disk, no PHP execution.
    location ^~ /wp-content/uploads/ {
        include snippets/ina-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        location ~* \.php$ { deny all; }
        try_files $uri =404;
    }

    # Block abuse vectors.
    location = /xmlrpc.php { deny all; }
    location ~* /(?:\.git|\.env|wp-config\.php)$ { deny all; }
    # Never run PHP that was uploaded into wp-content.
    location ~* ^/wp-content/.*\.php$ { deny all; }

    # Standard WordPress front controller (admin, login, REST all flow through this).
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;        # SCRIPT_FILENAME, PATH_INFO, try_files =404
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 300;
    }
}
